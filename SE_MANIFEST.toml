# ============================================================
# SE_MANIFEST.toml (Repository Declaration)
# ============================================================

schema = "se-manifest-schema"
schema_url = "https://raw.githubusercontent.com/structural-explainability/se-manifest-schema/main/manifest-schema.toml"

# === Framework Context ===

[meta]
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
purpose = "Declares this repository's role in the Structural Explainability ecosystem."

# === Repository Identity ===

[repo]
name = "se-regimes-pilot-education-math-g8"
org = "structural-explainability"
class = "regimes"
kind = "pilot"
status = "active"
since = "2026"
summary = "Grade 8 mathematics stress-test case suite for SE regime profiles."

# === Layer Position ===

[layer]
space = "structural-explainability"
role  = "regime-execution"

# === Dependency Declarations ===

[depends]
required = [
  { repo = { repo = "se-regimes", kind = "semantic", version = "main" }, kind = "semantic", version = "main" },
]
optional = []

# === Provided Artifacts ===

[provides]
artifacts = [
  "education-math-g8-cases",
  "stress-report",
]

# === Scope ===

[scope]
includes = [
  "stress-test cases for regime profiles",
  "cases covering transformation families",
  "domain: education.math.g8",
]

excludes = [
  "regime registry",
  "transformation family definitions",
  "regime engine",
  "cases outside education.math.g8",
]


[validation]
entrypoint = "uv run python -m se_regimes_pilot report"

# === Behavior / governance ===

[naming]
pattern = "se-regimes-pilot-*"

[governance]
authority = "structural-explainability"

# === Compatibility ===

[compatibility]
constitution = "se-constitution"
kernel = "se-kernel"

# === External references ===

[citation]
cff = "CITATION.cff"

[traceability]
identifier_map = "cases/education/math/g8"
